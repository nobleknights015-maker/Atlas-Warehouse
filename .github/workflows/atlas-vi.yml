name: Atlas VI — warehouse operations

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        description: "Atlas warehouse command (try: status, help, receive ..., order add ...)"
        required: true
        type: string
        default: status
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: atlas-vi-main
  cancel-in-progress: false

jobs:
  warehouse:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.login == github.repository_owner &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/atlas '))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout warehouse
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Atlas VI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_COMMAND: ${{ inputs.command }}
        run: python warehouse/github_runner.py run
      - name: Validate changes
        run: |
          python -m unittest discover -s warehouse/tests -v
          python warehouse/atlas_warehouse.py validate
      - name: Persist authorized inventory changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- warehouse
          if ! git diff --cached --quiet; then
            git commit -m "atlas: update warehouse inventory and audit ledger"
            # Other repository commits can arrive while a GitHub worker runs.
            # Rebase before pushing so changes are not silently discarded.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo "Failed to persist warehouse inventory after retries" >&2
            exit 1
          else
            echo "Atlas VI: read-only command; no inventory changes."
          fi
      - name: Reply in issue or workflow summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python warehouse/github_runner.py post
