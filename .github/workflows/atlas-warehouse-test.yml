name: Atlas Warehouse validation

on:
  push:
    paths:
      - 'warehouse/**'
      - '.github/workflows/atlas-warehouse-test.yml'
  pull_request:
    paths:
      - 'warehouse/**'
      - '.github/workflows/atlas-warehouse-test.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: python -m unittest discover -s warehouse/tests -v
      - name: Validate inventory
        run: python warehouse/atlas_warehouse.py validate
