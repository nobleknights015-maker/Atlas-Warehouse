name: Z-Image Tideglass Tile Benchmark

on:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - 'modal_worker/zimage_tideglass_tile_benchmark.py'
      - '.github/workflows/run-zimage-tideglass-tile-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zimage-tideglass-tile-benchmark
  cancel-in-progress: true

jobs:
  bounded-zimage-tidal-silt:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install bounded benchmark dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12'
      - name: Compile benchmark surface
        run: python -m compileall -q modal_worker/zimage_tideglass_tile_benchmark.py modal_worker/world_asset_pipeline_v2_flux2_reference_batch.py
      - name: Run exactly one Tideglass challenger case
        shell: bash
        run: |
          set -o pipefail
          modal run modal_worker/zimage_tideglass_tile_benchmark.py | tee zimage-tideglass-benchmark.log
      - name: Upload challenger image and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zimage-tideglass-tile-${{ github.run_id }}
          path: |
            zimage-tideglass-benchmark.log
            zimage-tidal-silt-output.png
          if-no-files-found: warn
          retention-days: 7
