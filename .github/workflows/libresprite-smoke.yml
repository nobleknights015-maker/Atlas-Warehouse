name: LibreSprite pixel-editor integration smoke test

on:
  push:
    paths:
      - '.github/workflows/libresprite-smoke.yml'
      - 'warehouse/tools/libresprite_smoke.py'
      - 'warehouse/tools/libresprite_smoke.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-editor-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make small public-safe reference PNG
        run: python warehouse/tools/libresprite_smoke.py init

      - name: Install real LibreSprite 1.3 AppImage from official release
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 3 \
            https://github.com/LibreSprite/LibreSprite/releases/download/v1.3/libresprite-v1.3-linux-x86_64.AppImage \
            -o libresprite.AppImage
          chmod +x libresprite.AppImage
          ./libresprite.AppImage --appimage-extract >/dev/null
          ./squashfs-root/AppRun --version

      - name: Edit two actual PNG pixels inside LibreSprite
        run: ./squashfs-root/AppRun -b smoke_input.png --script warehouse/tools/libresprite_smoke.js --save-as smoke_output.png

      - name: Confirm the editor changed pixels and kept transparency
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python warehouse/tools/libresprite_smoke.py verify

      - name: Keep the reproducible results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libresprite-editor-smoke
          path: |
            smoke_input.png
            smoke_output.png
            smoke_report.json
          retention-days: 7
          if-no-files-found: warn
