name: Animagine Guardian Battler Gate

on:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - 'modal_worker/animagine_guardian_battler_gate.py'
      - '.github/workflows/run-animagine-guardian-battler-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animagine-guardian-battler-gate
  cancel-in-progress: true

jobs:
  one-shot-animagine-guardian:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install Modal client
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'
      - name: Compile gate
        run: python -m compileall -q modal_worker/animagine_guardian_battler_gate.py
      - name: Run exactly one bounded Animagine Guardian battler edit
        shell: bash
        run: |
          set -o pipefail
          timeout 300s modal run modal_worker/animagine_guardian_battler_gate.py | tee animagine-guardian-gate.log
      - name: Upload gate image and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animagine-guardian-gate-${{ github.run_id }}
          path: |
            animagine-guardian-gate.log
            animagine-bramblebuck-battler-test.png
          if-no-files-found: warn
          retention-days: 7
