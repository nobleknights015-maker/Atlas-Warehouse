name: Aurora standalone prompt-only generation
on:
  workflow_dispatch:
  push:
    branches: [aurora-isolated-img2img-pilot]
    paths: [aurora/presets.json]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    defaults:
      run:
        working-directory: aurora
    steps:
      - uses: actions/checkout@v4
      - name: Check Modal credentials before GPU allocation
        run: test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Modal client
        run: python -m pip install 'modal>=1.0,<2'
      - name: Test 3 controlled
        run: modal run worker.py --preset controlled --output outputs/controlled.png
      - name: Test 1 bolder romance
        run: modal run worker.py --preset bold --output outputs/bold.png
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-text-prompt-tests
          path: aurora/outputs/*.png
          if-no-files-found: ignore
