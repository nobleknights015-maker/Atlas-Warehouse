name: Qwen 2511 Guardian Identity Gate

on:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - '.github/workflows/run-qwen2511-guardian-corruption-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen2511-guardian-identity-gate
  cancel-in-progress: true

jobs:
  one-shot-qwen2511-guardian:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install Modal client
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'
      - name: Compile gate
        run: python -m compileall -q modal_worker/qwen2511_guardian_corruption_gate.py
      - name: Run exactly one bounded Qwen Lightning Guardian identity edit
        shell: bash
        run: |
          set -o pipefail
          timeout 180s modal run modal_worker/qwen2511_guardian_corruption_gate.py | tee qwen2511-guardian-gate.log
      - name: Upload gate image and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen2511-guardian-gate-${{ github.run_id }}
          path: |
            qwen2511-guardian-gate.log
            qwen2511-bramblebuck-identity-test.png
          if-no-files-found: warn
          retention-days: 7
